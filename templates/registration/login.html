{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card auth-card">
  <div class="card-body p-4">
    <h1 class="h3 mb-1">Welcome back</h1>
    <p class="text-muted">Log in to access your safety dashboard.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors|join:" " }}</div>{% endif %}
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Email</label>
        <input type="email" name="username" id="{{ form.username.id_for_label }}" class="form-control form-control-lg"
               value="{{ form.username.value|default:'' }}" autocomplete="email" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
        <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control form-control-lg"
               autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary btn-lg w-100" type="submit">Log in</button>
    </form>
    <p class="mt-3 mb-0 text-center">New here? <a href="{% url 'register' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
