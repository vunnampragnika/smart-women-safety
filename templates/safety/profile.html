{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="card auth-card" style="max-width: 620px;">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">My profile</h1>
    <p class="text-muted small">Email (login): <strong>{{ user.email }}</strong></p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
      </div>
      {% endfor %}
      <button class="btn btn-primary" type="submit">Save changes</button>
    </form>
  </div>
</div>
{% endblock %}
